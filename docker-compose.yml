version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: miami_vice
      POSTGRES_USER: miami
      POSTGRES_PASSWORD: vice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00-keycloak-db.sql:/docker-entrypoint-initdb.d/00-keycloak-db.sql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./model:/docker-entrypoint-initdb.d/model
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miami -d miami_vice"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      # Réutilise les identifiants Postgres déjà présents (miami/vice) :
      # la base "keycloak" leur appartient (créée par
      # sql/00-keycloak-db.sql), ce qui évite un rôle dédié pour ce premier
      # passage dev. À durcir (rôle Keycloak séparé, secrets non versionnés)
      # avant tout usage hors développement.
      KC_DB_USERNAME: miami
      KC_DB_PASSWORD: vice
      # Hostname fixé explicitement (pas de mode "request based") : le
      # navigateur appelle Keycloak via http://localhost:8080 (port publié
      # sur l'hôte), tandis que le backend l'appelle via l'URL interne
      # Docker http://keycloak:8080 pour récupérer les clés JWKS. Sans
      # KC_HOSTNAME fixé, l'émetteur ("iss") des tokens dépendrait du Host
      # vu par Keycloak au moment de la requête (localhost:8080 depuis le
      # navigateur) et serait incohérent avec un éventuel appel interne
      # (client_credentials futur depuis le backend via keycloak:8080) :
      # fixer KC_HOSTNAME garantit un "iss" unique et stable
      # (http://localhost:8080/realms/miami-vice), quelle que soit l'origine
      # de la requête. KC_HOSTNAME_STRICT=false est nécessaire pour que
      # Keycloak accepte quand même les requêtes dont l'en-tête Host ne
      # correspond pas à KC_HOSTNAME (cas du backend qui appelle via
      # "keycloak:8080", pas "localhost:8080").
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keycloak/miami-vice-realm.json:/opt/keycloak/data/import/miami-vice-realm.json

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://miami:vice@db:5432/miami_vice
      KEYCLOAK_ISSUER: http://localhost:8080/realms/miami-vice
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/miami-vice/protocol/openid-connect/certs
      FILE_STORAGE_ROOT: /data/files
      SECRET_ENCRYPTION_KEY: ddXSHT-E_tqov4_gqrxSnE9iVpwWAFwnfxhqZ03i6dc=
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./model:/model
      - ./files:/data/files

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Brique d'infra préparatoire pour le futur type d'attribut "datasource"
  # (Prometheus/PostgreSQL, voir tocheck.md #1 et specifications/07-roadmap.md
  # §10.11) : aucune implémentation applicative à ce stade, juste une
  # instance Prometheus réelle avec des métriques réelles (via node-exporter)
  # pour pouvoir tester ce type d'attribut plus tard.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - claude-agent-metrics:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'

  # Métrique `claude_agent{agent="..."} 0|1` par type d'agent Claude Code
  # (worker/testeur/pessimiste/candide/orchestrateur/testeur-global),
  # exposée via le textfile collector de node-exporter ci-dessus. Signal
  # approximatif (mtime récent des transcripts ~/.claude/.../subagents/),
  # pas un vrai "appel LLM en cours" — il n'existe pas d'API externe pour
  # ça. Script autonome, aucun coût LLM, cadence réelle de 15s (voir
  # tools/claude-agent-exporter/exporter.sh).
  claude-agent-exporter:
    image: alpine:3.20
    command: ["sh", "/app/exporter.sh"]
    environment:
      CLAUDE_PROJECTS_DIR: /claude-projects
      OUT_FILE: /metrics/claude_agents.prom
      FRESH_SECONDS: "20"
      INTERVAL: "15"
    volumes:
      - ./tools/claude-agent-exporter:/app:ro
      - ${HOME}/.claude/projects:/claude-projects:ro
      - claude-agent-metrics:/metrics

